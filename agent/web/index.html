<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Агент</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; padding: .8rem; height: 60vh; overflow-y: auto; background: #fafafa; }
    .msg { margin: .4rem 0; white-space: pre-wrap; }
    .user { color: #1a73e8; }
    .assistant { color: #333; }
    .typing { color: #999; font-style: italic; margin: .4rem 0; }
    .meta { font-size: .75rem; color: #888; }
    form { display: flex; gap: .5rem; margin-top: .8rem; }
    input { flex: 1; padding: .5rem; }
    button { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>Агент</h1>
  <div id="log"></div>
  <form id="form">
    <input id="msg" type="text" placeholder="Сообщение..." autofocus>
    <button type="submit">Отправить</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('msg');

    function add(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = (role === 'user' ? 'Вы: ' : 'Агент: ') + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    let typingEl = null;
    function showTyping() {
      if (typingEl) return;
      typingEl = document.createElement('div');
      typingEl.className = 'typing';
      typingEl.textContent = 'Агент печатает…';
      log.appendChild(typingEl);
      log.scrollTop = log.scrollHeight;
    }
    function hideTyping() {
      if (typingEl) { typingEl.remove(); typingEl = null; }
    }

    // Показываем сохранённую историю при загрузке страницы (после перезапуска).
    async function loadHistory() {
      try {
        const resp = await fetch('/history');
        if (!resp.ok) return;
        const msgs = await resp.json();
        for (const m of msgs) add(m.role === 'user' ? 'user' : 'assistant', m.content);
      } catch (err) { /* игнорируем */ }
    }
    loadHistory();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      add('user', text);
      showTyping();
      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        hideTyping();
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        add('assistant', data.reply);
        if (data.usage) {
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = 'токены: ' + data.usage.total_tokens +
            ' (запрос ' + data.usage.prompt_tokens +
            ', ответ ' + data.usage.completion_tokens + ')';
          log.appendChild(meta);
        }
      } catch (err) {
        hideTyping();
        add('assistant', '[ошибка] ' + err.message);
      }
    });
  </script>
</body>
</html>
